<!doctype html>
<!--
  The source of public/og.png, the one card image every page links to for social
  previews. It is a screenshot rather than a build step because there is exactly
  one of it: adding satori and resvg to render a single static image would be more
  moving parts than the image is worth.

  To regenerate after editing: serve this directory, open it at a 1200x630
  viewport, screenshot the viewport, and save the result to public/og.png.
-->
<meta charset="utf-8" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@700&display=swap"
/>
<style>
  :root {
    --paper: oklch(98% 0.004 240);
    --sky: oklch(96.5% 0.02 244);
    --ink: oklch(18% 0.034 255);
    --ink2: oklch(28% 0.03 252);
    --muted: oklch(52% 0.02 250);
    --rule: oklch(90% 0.01 240);
    --accent: oklch(54% 0.192 40);
    --card: oklch(99.4% 0.002 240);
  }
  * {
    margin: 0;
    box-sizing: border-box;
  }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Geist', 'Zen Kaku Gothic New', sans-serif;
    color: var(--ink2);
    background: linear-gradient(
      180deg,
      var(--sky) 0,
      color-mix(in oklab, var(--sky) 40%, var(--paper)) 60%,
      var(--paper) 100%
    );
    padding: 76px 80px 72px;
    display: flex;
    flex-direction: column;
    gap: 56px;
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'Plus Jakarta Sans', 'Zen Kaku Gothic New', sans-serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.04em;
    color: var(--ink);
  }
  .mark img {
    width: 40px;
    height: 40px;
    border-radius: 9px;
  }
  .accent {
    color: var(--accent);
  }
  h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 68px;
    line-height: 1.04;
    letter-spacing: -0.035em;
    color: var(--ink);
    max-width: 19ch;
  }
  p.lede {
    margin-top: 24px;
    font-size: 24px;
    line-height: 1.5;
    color: var(--ink2);
    max-width: 60ch;
  }
  dl {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--rule);
    padding-top: 22px;
  }
  div.f {
    padding-right: 40px;
  }
  div.f + div.f {
    border-left: 1px solid var(--rule);
    padding-left: 40px;
  }
  dt {
    font-family: 'Geist Mono', monospace;
    font-weight: 500;
    font-size: 23px;
    color: var(--ink);
    line-height: 1;
  }
  dd {
    margin-top: 8px;
    font-size: 15px;
    color: var(--muted);
    line-height: 1;
  }
  .url {
    font-family: 'Geist Mono', monospace;
    font-size: 17px;
    color: var(--accent);
    margin-left: auto;
    align-self: flex-end;
  }
</style>
<div class="mark">
  <img src="../public/favicon.svg" alt="" />天気<span class="accent">Now</span>
</div>
<div style="margin-top: auto">
  <h1>A free weather API for <span class="accent">Japan</span>.</h1>
  <p class="lede">Every AMeDAS station, looked up by coordinate. JSON, no API key.</p>
</div>
<dl style="margin-top: auto">
  <div class="f">
    <dt>~1,300</dt>
    <dd>stations</dd>
  </div>
  <div class="f">
    <dt>10 min</dt>
    <dd>refresh</dd>
  </div>
  <div class="f">
    <dt>30 days</dt>
    <dd>history</dd>
  </div>
  <div class="f">
    <dt>No key</dt>
    <dd>public GETs</dd>
  </div>
  <div class="url">tenkinow.com</div>
</dl>
